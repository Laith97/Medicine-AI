                    specialty:
                      type: string
                    max_wait_time:
                      type: integer
                    preferred_times:
                      type: array
                      items:
                        type: string

    post:
      summary: Create waitlist preference
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                doctor_id:
                  type: integer
                specialty:
                  type: string
                max_wait_time:
                  type: integer
                preferred_times:
                  type: array
                  items:
                    type: string
      responses:
