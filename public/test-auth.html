<!DOCTYPE html>
<html>
<head>
    <title>Broadcasting Auth Test</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <h1>Broadcasting Authentication Test</h1>
    <button onclick="testAuth()">Test Broadcasting Auth</button>
    <div id="result"></div>

    <script>
        async function testAuth() {
            const resultDiv = document.getElementById('result');

            try {
                // Get CSRF token
                const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || 'missing';

                resultDiv.innerHTML = '<p>Testing broadcasting auth...</p>';

                const response = await fetch('/broadcasting/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': csrfToken,
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        socket_id: 'test.123',
                        channel_name: 'private-App.User.1'
                    })
                });

                const data = await response.text();

                resultDiv.innerHTML = `
                    <h3>Auth Test Result:</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Response:</strong></p>
                    <pre>${data}</pre>
                `;

            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
