# Medicine-AI Redis Configuration for Production
# Based on Redis 7.0+ with security and performance optimizations

# Network Configuration
bind 127.0.0.1 ::1
port 6379
timeout 300
tcp-keepalive 300
tcp-backlog 511

# Security Configuration
# requirepass your_strong_redis_password_here
protected-mode yes

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command SHUTDOWN SHUTDOWN_REDIS
rename-command CONFIG CONFIG_REDIS
rename-command DEBUG DEBUG_REDIS

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Configuration
save 900 1
save 300 10
save 60 10000

# RDB Configuration
dbfilename medicine-ai.rdb
dir /var/lib/redis
rdbcompression yes
rdbchecksum yes

# AOF Configuration
appendonly yes
appendfilename "medicine-ai.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Performance Tuning
databases 16
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Connection Management
maxclients 10000
maxclients + 1000

# Replication (if using Redis cluster/sentinel)
# replicaof <masterip> <masterport>
# masterauth <master-password>

# Sentinel Configuration (uncomment if using Redis Sentinel)
# sentinel monitor medicine-ai-master 127.0.0.1 6379 2
# sentinel auth-pass medicine-ai-master your_redis_password
# sentinel down-after-milliseconds medicine-ai-master 5000
# sentinel failover-timeout medicine-ai-master 60000
# sentinel parallel-syncs medicine-ai-master 1

# Cluster Configuration (uncomment if using Redis Cluster)
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 5000
# cluster-migration-barrier 1
# cluster-require-full-coverage yes

# Lua Scripting
lua-time-limit 5000

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 100

# Event Notification
notify-keyspace-events Ex

# Advanced Configuration
activerehashing yes
hz 10
dynamic-hz yes

# Disable THP (Transparent Huge Pages) warnings
# This should be handled at OS level, but Redis can warn about it
disable-thp-warnings no

# IO Threads (Redis 6.0+)
io-threads 4
io-threads-do-reads yes

# ACL (Access Control List) - Redis 6.0+
# aclfile /etc/redis/acl.conf

# TLS/SSL Configuration (Redis 6.0+)
# tls-port 6380
# tls-cert-file /etc/ssl/certs/redis.crt
# tls-key-file /etc/ssl/private/redis.key
# tls-ca-cert-file /etc/ssl/certs/ca.crt
# tls-auth-clients no
# tls-replication yes
# tls-cluster yes
