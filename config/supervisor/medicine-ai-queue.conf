# Medicine-AI Queue Worker Configuration for Supervisor
# Place this file in /etc/supervisor/conf.d/

[program:medicine-ai-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/medicine-ai/artisan queue:work --sleep=3 --tries=3 --max-jobs=1000 --timeout=90
directory=/var/www/medicine-ai
user=www-data
numprocs=4
priority=999
autostart=true
autorestart=true
startretries=3
startsecs=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/medicine-ai-queue.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/medicine-ai-queue-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

# Environment variables
environment=
    APP_ENV=production,
    QUEUE_CONNECTION=redis,
    REDIS_HOST=127.0.0.1,
    REDIS_PORT=6379

# Stop signal
stopsignal=TERM
stopwaitsecs=30

[group:medicine-ai-workers]
programs=medicine-ai-queue-worker
priority=999

# Optional: High priority queue worker
[program:medicine-ai-high-queue-worker]
command=php /var/www/medicine-ai/artisan queue:work --queue=high --sleep=1 --tries=3 --max-jobs=1000 --timeout=60
directory=/var/www/medicine-ai
user=www-data
numprocs=2
priority=998
autostart=true
autorestart=true
startretries=3
startsecs=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/medicine-ai-high-queue.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/medicine-ai-high-queue-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

environment=
    APP_ENV=production,
    QUEUE_CONNECTION=redis,
    REDIS_HOST=127.0.0.1,
    REDIS_PORT=6379

stopsignal=TERM
stopwaitsecs=30

# Optional: Low priority queue worker
[program:medicine-ai-low-queue-worker]
command=php /var/www/medicine-ai/artisan queue:work --queue=low --sleep=10 --tries=3 --max-jobs=500 --timeout=120
directory=/var/www/medicine-ai
user=www-data
numprocs=1
priority=1000
autostart=true
autorestart=true
startretries=3
startsecs=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/medicine-ai-low-queue.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/medicine-ai-low-queue-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

environment=
    APP_ENV=production,
    QUEUE_CONNECTION=redis,
    REDIS_HOST=127.0.0.1,
    REDIS_PORT=6379

stopsignal=TERM
stopwaitsecs=30

# Add all workers to the group
[group:medicine-ai-all-workers]
programs=medicine-ai-queue-worker,medicine-ai-high-queue-worker,medicine-ai-low-queue-worker
priority=999
