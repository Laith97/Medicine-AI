<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Transformation JavaScript Tests</title>
    <meta name="csrf-token" content="test-csrf-token">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .test-pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .test-fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .test-section { margin: 20px 0; border: 1px solid #ddd; padding: 15px; }
        #testResults { margin-top: 20px; }

        /* Mock form styling */
        .form-control, .form-select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .col-md-4 { margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>Form Transformation JavaScript Unit Tests</h1>

    <!-- Mock form elements that match the prescription form -->
    <div id="mockForm" style="display: none;">
        <div class="col-md-4">
            <label for="form" class="form-label fw-semibold">Form <span class="text-danger">*</span></label>
            <select class="form-select" id="form" name="form" required>
                <option value="">Select form</option>
                <option value="tablet">Tablet</option>
                <option value="capsule">Capsule</option>
                <option value="liquid">Liquid</option>
                <option value="injection">Injection</option>
                <option value="cream">Cream/Ointment</option>
                <option value="inhaler">Inhaler</option>
                <option value="patch">Patch</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="route" class="form-label fw-semibold">Route <span class="text-danger">*</span></label>
            <select class="form-select" id="route" name="route" required>
                <option value="">Select route</option>
                <option value="oral">Oral</option>
                <option value="topical">Topical</option>
                <option value="intravenous">Intravenous</option>
                <option value="intramuscular">Intramuscular</option>
                <option value="subcutaneous">Subcutaneous</option>
                <option value="inhalation">Inhalation</option>
                <option value="rectal">Rectal</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="frequency" class="form-label fw-semibold">Frequency <span class="text-danger">*</span></label>
            <select class="form-select" id="frequency" name="frequency" required>
                <option value="">Select frequency</option>
                <option value="once daily">Once daily</option>
                <option value="twice daily">Twice daily</option>
                <option value="three times daily">Three times daily</option>
                <option value="four times daily">Four times daily</option>
                <option value="every 6 hours">Every 6 hours</option>
                <option value="every 8 hours">Every 8 hours</option>
                <option value="every 12 hours">Every 12 hours</option>
                <option value="as needed">As needed</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="duration" class="form-label fw-semibold">Duration <span class="text-danger">*</span></label>
            <select class="form-select" id="duration" name="duration" required>
                <option value="">Select duration</option>
                <option value="3 days">3 days</option>
                <option value="7 days">7 days</option>
                <option value="10 days">10 days</option>
                <option value="14 days">14 days</option>
                <option value="1 month">1 month</option>
                <option value="2 months">2 months</option>
                <option value="3 months">3 months</option>
                <option value="6 months">6 months</option>
                <option value="other">Other</option>
            </select>
        </div>
    </div>

    <div id="testResults"></div>

    <script>
        // Mock form transformation functions (copied from the actual implementation)
        function initializeFormTransformation() {
            // Handle form field transformation
            const formSelect = document.getElementById('form');
            if (formSelect) {
                formSelect.addEventListener('change', function() {
                    if (this.value === 'other') {
                        transformToTextInput(this, 'form');
                    } else {
                        ensureSelectField(this, 'form');
                    }
                });
            }

            // Handle route field transformation
            const routeSelect = document.getElementById('route');
            if (routeSelect) {
                routeSelect.addEventListener('change', function() {
                    if (this.value === 'other') {
                        transformToTextInput(this, 'route');
                    } else {
                        ensureSelectField(this, 'route');
                    }
                });
            }

            // Handle frequency field transformation
            const frequencySelect = document.getElementById('frequency');
            if (frequencySelect) {
                frequencySelect.addEventListener('change', function() {
                    if (this.value === 'other') {
                        transformToTextInput(this, 'frequency');
                    } else {
                        ensureSelectField(this, 'frequency');
                    }
                });
            }

            // Handle duration field transformation
            const durationSelect = document.getElementById('duration');
            if (durationSelect) {
                durationSelect.addEventListener('change', function() {
                    if (this.value === 'other') {
                        transformToTextInput(this, 'duration');
                    } else {
                        ensureSelectField(this, 'duration');
                    }
                });
            }
        }

        function transformToTextInput(selectElement, fieldType) {
            const parent = selectElement.parentElement;
            const currentValue = selectElement.value;

            // Create text input
            const textInput = document.createElement('input');
            textInput.type = 'text';
            textInput.className = 'form-control';
            textInput.id = fieldType;
            textInput.name = fieldType;
            textInput.required = true;

            // Set field-specific placeholder
            const placeholders = {
                'form': 'Enter custom form (e.g., Suppository, Patch)',
                'route': 'Enter custom route (e.g., Topical, Sublingual)',
                'frequency': 'Enter custom frequency (e.g., Every 4 hours)',
                'duration': 'Enter custom duration (e.g., 3 weeks)'
            };
            textInput.placeholder = placeholders[fieldType] || 'Enter custom value';

            // Preserve any existing custom value or set default
            if (currentValue === 'other' || !currentValue) {
                textInput.value = '';
            } else {
                textInput.value = currentValue;
            }

            // Replace select with input
            parent.replaceChild(textInput, selectElement);

            // Focus on the new input
            textInput.focus();
        }

        function ensureSelectField(currentElement, fieldType) {
            if (currentElement.tagName === 'SELECT') return;

            const parent = currentElement.parentElement;
            const currentValue = currentElement.value;

            // Create select element
            const selectElement = document.createElement('select');
            selectElement.className = 'form-select';
            selectElement.id = fieldType;
            selectElement.name = fieldType;
            selectElement.required = true;

            // Define options for each field type
            const fieldOptions = {
                'form': [
                    { value: '', text: 'Select form' },
                    { value: 'tablet', text: 'Tablet' },
                    { value: 'capsule', text: 'Capsule' },
                    { value: 'liquid', text: 'Liquid' },
                    { value: 'injection', text: 'Injection' },
                    { value: 'cream', text: 'Cream/Ointment' },
                    { value: 'inhaler', text: 'Inhaler' },
                    { value: 'patch', text: 'Patch' },
                    { value: 'other', text: 'Other' }
                ],
                'route': [
                    { value: '', text: 'Select route' },
                    { value: 'oral', text: 'Oral' },
                    { value: 'topical', text: 'Topical' },
                    { value: 'intravenous', text: 'Intravenous' },
                    { value: 'intramuscular', text: 'Intramuscular' },
                    { value: 'subcutaneous', text: 'Subcutaneous' },
                    { value: 'inhalation', text: 'Inhalation' },
                    { value: 'rectal', text: 'Rectal' },
                    { value: 'other', text: 'Other' }
                ],
                'frequency': [
                    { value: '', text: 'Select frequency' },
                    { value: 'once daily', text: 'Once daily' },
                    { value: 'twice daily', text: 'Twice daily' },
                    { value: 'three times daily', text: 'Three times daily' },
                    { value: 'four times daily', text: 'Four times daily' },
                    { value: 'every 6 hours', text: 'Every 6 hours' },
                    { value: 'every 8 hours', text: 'Every 8 hours' },
                    { value: 'every 12 hours', text: 'Every 12 hours' },
                    { value: 'as needed', text: 'As needed' },
                    { value: 'other', text: 'Other' }
                ],
                'duration': [
                    { value: '', text: 'Select duration' },
                    { value: '3 days', text: '3 days' },
                    { value: '7 days', text: '7 days' },
                    { value: '10 days', text: '10 days' },
                    { value: '14 days', text: '14 days' },
                    { value: '1 month', text: '1 month' },
                    { value: '2 months', text: '2 months' },
                    { value: '3 months', text: '3 months' },
                    { value: '6 months', text: '6 months' },
                    { value: 'other', text: 'Other' }
                ]
            };

            const options = fieldOptions[fieldType] || [];
            options.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.value = option.value;
                optionElement.textContent = option.text;
                if (option.value === currentValue) {
                    optionElement.selected = true;
                }
                selectElement.appendChild(optionElement);
            });

            // Replace input with select
            parent.replaceChild(selectElement, currentElement);
        }

        function resetFormField() {
            const fields = ['form', 'route', 'frequency', 'duration'];
            fields.forEach(fieldType => {
                const element = document.getElementById(fieldType);
                if (element && element.tagName !== 'SELECT') {
                    ensureSelectField(element, fieldType);
                }
            });
        }

        // Test Suite
        class FormTransformationTestSuite {
            constructor() {
                this.tests = [];
                this.results = [];
            }

            addTest(name, testFunction) {
                this.tests.push({ name, testFunction });
            }

            async runTests() {
                const resultsDiv = document.getElementById('testResults');
                resultsDiv.innerHTML = '<h2>Test Results</h2>';

                for (const test of this.tests) {
                    try {
                        await test.testFunction();
                        this.results.push({ name: test.name, passed: true, error: null });
                        this.displayResult(test.name, true, null);
                    } catch (error) {
                        this.results.push({ name: test.name, passed: false, error: error.message });
                        this.displayResult(test.name, false, error.message);
                    }
                }

                this.displaySummary();
            }

            displayResult(testName, passed, error) {
                const resultsDiv = document.getElementById('testResults');
                const resultDiv = document.createElement('div');
                resultDiv.className = `test-result ${passed ? 'test-pass' : 'test-fail'}`;
                resultDiv.innerHTML = `
                    <strong>${passed ? '✓' : '✗'} ${testName}</strong>
                    ${error ? `<br><small>Error: ${error}</small>` : ''}
                `;
                resultsDiv.appendChild(resultDiv);
            }

            displaySummary() {
                const passed = this.results.filter(r => r.passed).length;
                const total = this.results.length;
                const resultsDiv = document.getElementById('testResults');

                const summaryDiv = document.createElement('div');
                summaryDiv.className = `test-result ${passed === total ? 'test-pass' : 'test-fail'}`;
                summaryDiv.innerHTML = `<strong>Summary: ${passed}/${total} tests passed</strong>`;
                resultsDiv.appendChild(summaryDiv);
            }
        }

        // Initialize test suite
        const testSuite = new FormTransformationTestSuite();

        // Test: Form transformation initialization
        testSuite.addTest('Form transformation can be initialized', async () => {
            initializeFormTransformation();
            const formSelect = document.getElementById('form');
            if (!formSelect) throw new Error('Form select not found');
            // Check if event listener was added (can't test directly, but element exists)
        });

        // Test: Form field transforms to text input when "Other" is selected
        testSuite.addTest('Form field transforms to text input when "Other" is selected', async () => {
            const formSelect = document.getElementById('form');
            formSelect.value = 'other';
            formSelect.dispatchEvent(new Event('change'));

            // Wait for DOM update
            await new Promise(resolve => setTimeout(resolve, 10));

            const transformedElement = document.getElementById('form');
            if (!transformedElement || transformedElement.tagName !== 'INPUT') {
                throw new Error('Form field was not transformed to input');
            }
            if (transformedElement.type !== 'text') {
                throw new Error('Transformed element is not a text input');
            }
            if (transformedElement.placeholder !== 'Enter custom form (e.g., Suppository, Patch)') {
                throw new Error('Placeholder text is incorrect');
            }
        });

        // Test: Route field transforms to text input when "Other" is selected
        testSuite.addTest('Route field transforms to text input when "Other" is selected', async () => {
            const routeSelect = document.getElementById('route');
            routeSelect.value = 'other';
            routeSelect.dispatchEvent(new Event('change'));

            await new Promise(resolve => setTimeout(resolve, 10));

            const transformedElement = document.getElementById('route');
            if (!transformedElement || transformedElement.tagName !== 'INPUT') {
                throw new Error('Route field was not transformed to input');
            }
            if (transformedElement.placeholder !== 'Enter custom route (e.g., Topical, Sublingual)') {
                throw new Error('Route placeholder text is incorrect');
            }
        });

        // Test: Frequency field transforms to text input when "Other" is selected
        testSuite.addTest('Frequency field transforms to text input when "Other" is selected', async () => {
            const frequencySelect = document.getElementById('frequency');
            frequencySelect.value = 'other';
            frequencySelect.dispatchEvent(new Event('change'));

            await new Promise(resolve => setTimeout(resolve, 10));

            const transformedElement = document.getElementById('frequency');
            if (!transformedElement || transformedElement.tagName !== 'INPUT') {
                throw new Error('Frequency field was not transformed to input');
            }
            if (transformedElement.placeholder !== 'Enter custom frequency (e.g., Every 4 hours)') {
                throw new Error('Frequency placeholder text is incorrect');
            }
        });

        // Test: Duration field transforms to text input when "Other" is selected
        testSuite.addTest('Duration field transforms to text input when "Other" is selected', async () => {
            const durationSelect = document.getElementById('duration');
            durationSelect.value = 'other';
            durationSelect.dispatchEvent(new Event('change'));

            await new Promise(resolve => setTimeout(resolve, 10));

            const transformedElement = document.getElementById('duration');
            if (!transformedElement || transformedElement.tagName !== 'INPUT') {
                throw new Error('Duration field was not transformed to input');
            }
            if (transformedElement.placeholder !== 'Enter custom duration (e.g., 3 weeks)') {
                throw new Error('Duration placeholder text is incorrect');
            }
        });

        // Test: Form field reverts to select when non-"Other" option is selected
        testSuite.addTest('Form field reverts to select when non-"Other" option is selected', async () => {
            // First transform to input
            const formSelect = document.getElementById('form');
            formSelect.value = 'other';
            formSelect.dispatchEvent(new Event('change'));

            await new Promise(resolve => setTimeout(resolve, 10));

            // Now change to a regular option
            const textInput = document.getElementById('form');
            textInput.value = 'tablet';
            textInput.dispatchEvent(new Event('change'));

            await new Promise(resolve => setTimeout(resolve, 10));

            const revertedElement = document.getElementById('form');
            if (!revertedElement || revertedElement.tagName !== 'SELECT') {
                throw new Error('Form field was not reverted to select');
            }
            if (revertedElement.value !== 'tablet') {
                throw new Error('Selected value was not preserved');
            }
        });

        // Test: Reset form field functionality
        testSuite.addTest('Reset form field functionality works', async () => {
            // Transform all fields to inputs
            const fields = ['form', 'route', 'frequency', 'duration'];
            for (const field of fields) {
                const select = document.getElementById(field);
                select.value = 'other';
                select.dispatchEvent(new Event('change'));
            }

            await new Promise(resolve => setTimeout(resolve, 10));

            // Reset all fields
            resetFormField();

            await new Promise(resolve => setTimeout(resolve, 10));

            // Check all fields are back to selects
            for (const field of fields) {
                const element = document.getElementById(field);
                if (!element || element.tagName !== 'SELECT') {
                    throw new Error(`${field} field was not reset to select`);
                }
            }
        });

        // Test: Custom value preservation during transformation
        testSuite.addTest('Custom value preservation during transformation', async () => {
            const formSelect = document.getElementById('form');
            formSelect.value = 'other';
            formSelect.dispatchEvent(new Event('change'));

            await new Promise(resolve => setTimeout(resolve, 10));

            const textInput = document.getElementById('form');
            textInput.value = 'Suppository';

            // Change back to select
            textInput.dispatchEvent(new Event('change'));

            await new Promise(resolve => setTimeout(resolve, 10));

            const selectElement = document.getElementById('form');
            if (selectElement.value !== 'Suppository') {
                throw new Error('Custom value was not preserved');
            }
        });

        // Run all tests when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Make mock form visible for testing
            document.getElementById('mockForm').style.display = 'block';
            testSuite.runTests();
        });
    </script>
</body>
</html>
